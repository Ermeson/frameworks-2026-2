<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raissa Vidal - Repositório de Projetos</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Header / Topbar -->
    <header class="container topbar">
        <div>
            <h3>Repositório de projetos</h3>
        </div>
        <div>
            <figure>
                <img src="img/icon.svg" alt="Ícone decorativo">
            </figure>
        </div>
        <div>
            <h3>Frameworks</h3>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Hero Title -->
        <section class="container">
            <h1>Raissa Vidal</h1>
        </section>

        <!-- Project Cards -->
        <section class="cards-section">
            <article class="container card card-green rotate-3">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>

            <article class="container card card-orange rotate-3-d">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>

            <article class="container card card-white rotate-3">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>

            <article class="container card card-lavanda rotate-3-d">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>

            <article class="container card card-amarelo-canario rotate-3">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>

            <article class="container card card-verde-lima rotate-3-d">
                <h2>NASA Space Apps</h2>
                <span>Julho de 2026</span>
            </article>
        </section>

        <!-- Call to Action -->
        <section class="container hand">
            <figure>
                <img src="img/hand.svg" alt="Ilustração de mão apontando">
            </figure>
            <h4>Segue nóix aí, parça</h4>
        </section>

        <!-- Tag Handle -->
        <section class="container">
            <div class="tag">
                @raissavidal
            </div>
        </section>

        <!-- Decorative Banner -->
        <div class="faixa">
            <img src="img/faixa.svg" alt="Faixa decorativa">
        </div>
    </main>

    <!-- Footer -->
    <footer class="container chewie">
        <figure>
            <img src="img/chewie.png" alt="Ilustração Chewbacca">
        </figure>
    </footer>

</body>
</html>
